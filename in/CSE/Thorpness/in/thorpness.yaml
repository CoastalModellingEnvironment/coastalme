# CoastalME Configuration File - Complete Example with Documentation
#
# This is a comprehensive example showing all available parameters with descriptions,
# data types, and example values. Use this as a template for creating your own
# CoastalME simulation configurations.
#
# Usage: ./cme --yaml --datafile=example_full_configuration.yaml
#
# Authors: CoastalME Development Team
# Date: 2025

# =============================================================================
# RUN INFORMATION - Basic simulation settings and output control
# =============================================================================
base_path: "in/CSE/Thorpness/in/"

run_information:
  # String: Base name for output files (no extension, no path)
  # This name will be used for log files, output files, and GIS outputs
  output_file_names: "jsme"

  # Integer: Level of detail in log file (0-4)
  # 0 = no log file, 1 = minimal, 2 = moderate, 3 = detailed, 4 = everything
  log_file_detail: 1

  # Boolean: Output per-timestep results in CSV format instead of fixed-width
  # true = CSV format (recommended), false = fixed-width format
  csv_per_timestep_results: true

# =============================================================================
# SIMULATION - Timing and duration settings
# =============================================================================
simulation:
  # String: Simulation start date and time in format "hh-mm-ss dd/mm/yyyy"
  # Used for timestamping outputs and calculating real-world time progression
  start_date_time: "00-00-00 01/01/2000"

  # String: Total simulation duration with units
  # Units can be: hours, days, months, years
  # Examples: "365 days", "24 hours", "2 years", "6 months"
  duration: "30 years"

  # String: Simulation timestep with units
  # Smaller timesteps = more accuracy but longer computation time
  # Examples: "1 hour", "6 hours", "1 day"
  timestep: "6 hours"

  # List of strings: Times at which to save outputs
  # Each entry should include value and unit
  save_times:
    # - "1 years"
    # - "6 months"
    # - "6 hours"
    - "1 months"

  # Integer: Random number seed for reproducible results
  # Use same seed to get identical results across runs
  # Omit this line or set to 0 to use system time as seed
  random_seed: 280764

# =============================================================================
# GIS OUTPUT - Geographic Information System output configuration
# =============================================================================
gis_output:
  # Integer: Maximum digits for GIS output file numbering (> 1)
  # Controls zero-padding: 3 = "001", "002", etc.
  max_save_digits: 3

  # String: File numbering system
  # "sequential" = continuous numbering (s), "iteration" = iteration-based (i)
  save_digits_mode: "sequential"

  # List of strings: Which raster files to output
  # Options: ["usual"] = standard set, ["all"] = everything, or specific codes
  # Common codes: "sea_depth", "beach_mask", "cliff_collapse", "polygon_gain_or_loss"
  raster_files:
    - "all"

  # String: Raster output format (GDAL format)
  # Common options: "gtiff", "ascii", "netcdf", "png"
  # Leave blank to use same format as input DEM
  raster_format: "gtiff"

  # Boolean: Output world files for raster georeferencing
  # Recommended: true for GIS compatibility
  world_file: true

  # Boolean: Scale output raster values for better visualization
  # May be needed for some GIS software compatibility
  scale_values: true

  # List of numbers: Elevation slices for 3D analysis (meters)
  # Creates horizontal slices through the model domain
  # Example: [0.0, 5.0, 10.0, 15.0] for slices at sea level, 5m, 10m, 15m
  slice_elevations: []

  # List of strings: Which vector files to output
  # Options: ["all"] = everything, or specific codes like ["normals", "coastlines"]
  vector_files:
    - "wave_transect_points"
    - "all"

  # String: Vector output format
  # Common options: "ESRI Shapefile", "GeoJSON", "KML"
  vector_format: "ESRI Shapefile"

  # List of strings: Time series files to generate
  # Options: ["all"] = everything, or specific codes like ["beach_change_net"]
  time_series_files: []

# =============================================================================
# GRID AND COASTLINE - Spatial processing and coastline detection
# =============================================================================
grid_and_coastline:
  # String/Integer: Coastline smoothing algorithm
  # Options: "none"(0), "running_mean"(1), "savitzky_golay"(2)
  # Savitzky-Golay recommended for most applications
  coastline_smoothing: "running_mean"

  # Integer: Window size for coastline smoothing (must be odd)
  # Larger values = more smoothing but may lose detail
  # Typical range: 5-15 for most coastlines
  coastline_smoothing_window: 31

  # Integer: Polynomial order for Savitzky-Golay smoothing
  # Options: 2 = quadratic, 4 = quartic
  # Higher order preserves more detail but may be less stable
  polynomial_order: 4

  # String: Grid edges to omit from coastline search
  # Options: any combination of N(orth), S(outh), E(ast), W(est)
  # Example: "NW" omits north and west edges
  omit_grid_edges: "W"

  # Integer: Profile slope smoothing window size
  # 0 = no smoothing, odd numbers only for smoothing
  # Used to smooth cross-shore profiles
  profile_smoothing_window: 0

  # Float: Maximum allowed local slope (m/m)
  # Used to detect unrealistic steep slopes in the DEM
  # Typical values: 0.5-2.0 depending on coastal type
  max_local_slope: 1.18

  # Float: Maximum elevation of beach above still water level (meters)
  # Used to distinguish beach from inland areas
  # Should be set based on local coastal geomorphology
  max_beach_elevation: 0

# =============================================================================
# LAYERS AND FILES - Input data files and sediment layer configuration
# =============================================================================
layers_and_files:
  # Integer: Number of sediment layers in the model
  # More layers = better vertical resolution but slower computation
  num_layers: 1

  # String: Path to basement DEM file (required)
  # This defines the underlying topography/bathymetry
  # Supported formats: GeoTIFF, ASCII Grid, NetCDF
  basement_dem_file: "in/CSE/Thorpness/in/THORPNESS_basement.asc"

  # Layer-specific sediment files (one section per layer, starting from layer_0)
  # Layer 0 is the bottom layer, layer 1 is above it, etc.
  layer_0:
    # String: Unconsolidated fine sediment thickness file
    # Fine sediments: clay, silt (< 0.062 mm)
    unconsolidated_fine: "in/CSE/Thorpness/in/THORPNESS_u_f.asc"

    # String: Unconsolidated sand sediment thickness file
    # Sand: 0.062-2.0 mm grain size
    unconsolidated_sand: "in/CSE/Thorpness/in/THORPNESS_u_s.asc"

    # String: Unconsolidated coarse sediment thickness file
    # Coarse sediments: gravel, cobbles (> 2.0 mm)
    unconsolidated_coarse: "in/CSE/Thorpness/in/THORPNESS_u_g.asc"

    # String: Consolidated fine sediment thickness file
    # Compacted/cemented fine sediments (clay, mudstone)
    consolidated_fine: "in/CSE/Thorpness/in/THORPNESS_c_f.asc"

    # String: Consolidated sand sediment thickness file
    # Sandstone, cemented sand layers
    consolidated_sand: "in/CSE/Thorpness/in/THORPNESS_c_s.asc"

    # String: Consolidated coarse sediment thickness file
    # Conglomerates, cemented gravels
    consolidated_coarse: "in/CSE/Thorpness/in/THORPNESS_c_g.asc"

  # Add layer_1, layer_2, etc. sections if num_layers > 1

  # String: Initial suspended sediment concentration file
  # Sediment already in the water column at simulation start
  suspended_sediment_file: ""

  # String: Initial landform classification file
  # Defines different coastal landform types (beach, cliff, platform, etc.)
  landform_file: ""

  # String: Coastal intervention/structure classification file
  # Defines locations of seawalls, groynes, breakwaters, etc.
  intervention_class_file: ""

  # String: Coastal intervention height file
  # Heights/elevations of coastal structures
  intervention_height_file: ""

# =============================================================================
# HYDROLOGY - Wave conditions, water levels, and hydrodynamic forcing
# =============================================================================
hydrology:
  # String: Wave propagation model selection
  # "COVE" = simple wave model, "CShore" = more sophisticated nearshore model
  # CShore recommended for most applications
  wave_propagation_model: "CShore"

  # Float: Density of seawater (kg/m³)
  # Standard seawater: ~1025, varies with temperature and salinity
  # Typical range: 1020-1030 kg/m³
  seawater_density: 1029

  # Float: Initial mean still water level (meters above datum)
  # Reference level for wave and erosion calculations
  # Set based on your vertical datum (e.g., mean sea level = 0)
  initial_water_level: 51.0

  # Float: Final mean still water level (meters above datum)
  # For sea level rise scenarios, leave blank for constant level
  # Example: 0.5 for 50cm sea level rise over simulation period
  final_water_level: 51.3

  # ========== Wave Input Configuration ==========
  # String: Wave input mode - determines which wave parameters to use
  # Options: "fixed" = constant wave conditions, "time_series" = time-varying waves
  # This parameter determines which of the wave parameter sets below will be read
  wave_input_mode: "time_series"

  # --- FOR MODE = "time_series" ---
  # Use these parameters when wave_input_mode: "time_series"
  # String: Time series file for varying wave heights
  # File should contain time and wave height columns
  wave_height_time_series: "in/CSE/Thorpness/in/cme_6_hours_POLWAM_MyPoint_23.dat"

  # String: Shapefile with wave station data for spatially-varying waves
  # Leave blank if using time series file only
  wave_height_shape_file: "in/CSE/Thorpness/in/S002DeepWaterWavesOneStations.shp"

  # --- FOR MODE = "fixed" ---
  # Use these parameters when wave_input_mode: "fixed"
  # Float: Deep water significant wave height (meters)
  # Typical range: 0.5-4.0m for most coastlines
  # wave_height: 2.0

  # Float: Deep water wave direction (degrees from North)
  # 0° = waves from North, 90° = from East, 180° = from South, 270° = from West
  # wave_orientation: 270.0

  # Float: Wave period (seconds)
  # Peak wave period, typical range: 5-15 seconds
  # wave_period: 8.0

  # String: Tidal data file path
  # File containing time series of tidal elevations
  # Leave blank for no tidal variation
  tide_data_file: "in/CSE/Thorpness/in/ThorpTide.dat"
  # tide_data_file:

  # Float: Breaking wave height to water depth ratio
  # Controls where waves break in shallow water
  # Typical values: 0.6-1.0, higher = waves break in shallower water
  breaking_wave_ratio: 0.8

# =============================================================================
# SEDIMENT AND EROSION - Sediment transport and coastal erosion parameters
# =============================================================================
sediment_and_erosion:
  # Boolean: Enable shore platform erosion modeling
  # Models erosion of rock platforms by wave action
  coast_platform_erosion: true

  # Float: Resistance to erosion of shore platform (m^(9/4)s^(3/2))
  # Higher values = more resistant rock
  # Typical range: 1e6 - 1e7 for different rock types
  platform_erosion_resistance: 2.5e3

  # Boolean: Enable beach sediment transport modeling
  # Core process for beach evolution modeling
  beach_sediment_transport: true

  # Integer: Boundary condition for sediment at grid edges
  # 0 = closed (no transport), 1 = open (free transport), 2 = recirculate
  # Open recommended for most regional studies
  beach_transport_at_edges: 1

  # String: Beach erosion/deposition equation
  # "CERC" = Shore Protection Manual formula, "Kamphuis" = modified equation
  # CERC most commonly used and validated
  beach_erosion_equation: "CERC"

  # Sediment grain size parameters (for Kamphuis equation only)
  # Set to 0 to use defaults, specify in millimeters if using Kamphuis
  median_sizes:
    # Float: Median grain size of fine sediment (mm)
    fine: 0.0
    # Float: Median grain size of sand sediment (mm)
    sand: 0.0
    # Float: Median grain size of coarse sediment (mm)
    coarse: 0.0

  # Float: Bulk density of beach sediment (kg/m³)
  # Quartz sand: ~2650 kg/m³, carbonate sand: ~2850 kg/m³
  sediment_density: 2650

  # Float: Porosity of beach sediment (0-1)
  # Typical beach sand porosity: 0.3-0.5
  # Higher porosity = more void space between grains
  beach_sediment_porosity: 0.4

  # Erosivity factors for different sediment types (relative erodibility)
  # Higher values = more easily eroded
  erosivity:
    # Float: Fine sediment erosivity
    fine: 1.0
    # Float: Sand sediment erosivity
    sand: 0.7
    # Float: Coarse sediment erosivity
    coarse: 0.3

  # Float: Transport parameter KLS for CERC equation
  # Calibration parameter, typical range: 0.3-0.8
  # Lower values = less sediment transport
  transport_kls: 0.4

  # Float: Transport parameter for Kamphuis equation
  # Only used if beach_erosion_equation = "Kamphuis"
  kamphuis_parameter: 5.0

  # Float: Berm height above still water level (meters)
  # Height where beach profile transitions to Dean equilibrium profile
  # Typical values: 0.2-1.0m depending on wave climate
  berm_height: 0.5

# =============================================================================
# CLIFF PARAMETERS - Cliff retreat and collapse modeling
# =============================================================================
cliff_parameters:
  # Boolean: Enable cliff collapse modeling
  # Models episodic failure of coastal cliffs
  cliff_collapse: true

  # Float: Resistance to erosion of cliff material (m^(9/4)s^(3/2))
  # Higher values = more resistant cliff rock
  # Should be higher than platform_erosion_resistance
  cliff_erosion_resistance: 2.0e3

  # Float: Notch overhang required to trigger collapse (meters)
  # Distance the notch must extend landward before cliff fails
  # Typical values: 0.3-2.0m depending on cliff height and rock strength
  notch_overhang: 0.8

  # Float: Depth of notch base below still water level (meters)
  # How deep the wave-cut notch extends
  # Typical range: 0.1-0.5m
  notch_base: 0.2

  # Float: Scale parameter A for cliff debris deposition (m^(1/3))
  # Controls distribution of collapsed cliff material
  # 0 = automatic calculation based on sediment size
  deposition_scale_parameter_a: 0

  # Float: Planview width of cliff debris talus (meters)
  # How far seaward the cliff debris extends
  # Depends on cliff height and wave energy
  talus_width: 15

  # Float: Minimum planview length of cliff debris (meters)
  # Minimum extent along the coastline
  min_talus_length: 50

  # Float: Minimum height of landward end of talus (fraction of cliff height)
  # Controls the slope of the debris pile, must be < 1.0
  min_talus_height: 0.5

# =============================================================================
# FLOOD PARAMETERS - Coastal flooding and storm surge modeling
# =============================================================================
flood_parameters:
  # Boolean: Enable flood modeling
  # Models inundation during storm events
  flood_input: false

  # String: Coastline where flooding is output
  # Leave blank if not using flood modeling
  flood_coastline: ""

  # String: Wave runup equation to use
  # Leave blank if not modeling flooding
  runup_equation: ""

  # String: Characteristic locations for flood analysis
  # Leave blank if not modeling flooding
  characteristic_locations: ""

  # String: Location of flood input data
  # Leave blank if not modeling flooding
  flood_input_location: ""

# =============================================================================
# SEDIMENT INPUT PARAMETERS - External sediment sources
# =============================================================================
sediment_input_parameters:
  # Boolean: Enable external sediment input events
  # Models sediment supply from rivers, nourishment, etc.
  sediment_input: false

  # String: Location of sediment inputs (point or line shapefile)
  # Leave blank if not using sediment inputs
  location: ""

  # String: Type of sediment input
  # Options: "P" = Point source, "C" = Coast block, "L" = Line source
  # Leave blank if not using sediment inputs
  type: ""

  # String: File with detailed sediment input specifications
  # Contains timing, volumes, grain sizes, etc.
  # Leave blank if not using sediment inputs
  details_file: ""

# =============================================================================
# PHYSICS AND GEOMETRY - Physical constants and geometric parameters
# =============================================================================
physics_and_geometry:
  # Float: Gravitational acceleration (m/s²)
  # Standard Earth gravity, rarely needs changing
  gravitational_acceleration: 9.81

  # Float: Typical spacing between coastline normal profiles (meters)
  # 0 = automatic spacing based on grid resolution
  # Smaller spacing = higher resolution but slower computation
  normal_spacing: 0

  # Float: Random factor for profile spacing (0-1)
  # 0 = perfectly regular spacing, 1 = maximum randomization
  # Adds natural variation to profile locations
  random_factor: 0.1

  # Float: Length of coastline normal profiles (meters)
  # How far offshore/onshore the profiles extend
  # Should be long enough to capture relevant processes
  normal_length: 900

  # Float: Start depth for wave calculations (ratio to wave height)
  # Depth where wave calculations begin as multiple of wave height
  # Typical values: 10-30 (deeper = more accurate but slower)
  start_depth_ratio: 30

  synthetic_transect_spacing: 20.0 # Target minimum spacing in meters

# =============================================================================
# PROFILE AND OUTPUT - Profile analysis and detailed output options
# =============================================================================
profile_and_output:
  # Boolean: Save detailed profile data for analysis
  # Creates files with cross-shore profile evolution
  save_profile_data: true

  # List of integers: Specific profile numbers to save
  # Leave empty to save none, or specify profile IDs
  # Only used if save_profile_data = true
  profile_numbers:
    - 1
    - 5

  # List of integers: Timesteps at which to save profiles
  # Leave empty to save none, or specify timestep numbers
  # Only used if save_profile_data = true
  profile_timesteps: []

  # Boolean: Save parallel profiles for 3D analysis
  # Creates additional profiles parallel to main coastline normals
  save_parallel_profiles: false

  # Boolean: Output erosion potential lookup values
  # Saves intermediate calculations for debugging/analysis
  output_erosion_potential: false

  # Integer: Size of moving window for coastline curvature calculation
  # Must be odd number, larger = smoother curvature calculation
  # Typical range: 7-15
  curvature_window: 11

# =============================================================================
# CLIFF EDGE PROCESSING - Cliff edge detection and smoothing
# =============================================================================
cliff_edge_processing:
  # String/Integer: Cliff edge smoothing algorithm
  # Options: "none"(0), "running_mean"(1), "savitzky_golay"(2)
  # Smooths the detected cliff edge line
  cliff_edge_smoothing: "none"

  # Integer: Window size for cliff edge smoothing (must be odd)
  # Larger values = more smoothing of cliff edge
  # Should be larger than coastline_smoothing_window
  cliff_edge_smoothing_window: 21

  # Integer: Polynomial order for Savitzky-Golay cliff edge smoothing
  # Options: 2 = quadratic, 4 = quartic
  # Only used if cliff_edge_smoothing = "savitzky_golay"
  cliff_edge_polynomial_order: 4

  # Float: Slope limit for cliff toe detection (m/m)
  # Minimum slope to be considered a cliff face
  # Lower values = detect gentler slopes as cliffs
  cliff_slope_limit: 0.5
# =============================================================================
# END OF CONFIGURATION
# =============================================================================
#
# This file demonstrates all available CoastalME parameters with explanations.
# For your simulation:
# 1. Copy this file and rename it appropriately
# 2. Modify the parameters relevant to your study area and objectives
# 3. Remove or comment out sections you don't need
# 4. Update all file paths to point to your actual input data
# 5. Validate your configuration before running long simulations
#
# Run with: ./cme --yaml --datafile=your_config.yaml
# Or let CoastalME auto-detect: ./cme --datafile=your_config.yaml
#
